<div class="container-fluid cadr"
>
<div class="content" style="margin-top: 10%;">
  <div class="brand" >
    <br>

    <img src="./assets/img/Menu/candor.ico" alt="Logo">
  </div>
  <form id="login-form" (ngSubmit)="onSubmit(form)" #form="ngForm" novalidate>
    <h2 class="login-title" style="color: #414848;">{{'Authentification' | translate}}</h2>
    <div class="form-group" [class.has-error]="email.invalid && email.touched">
      <div class="input-group-icon right">
        <div class="input-icon"><i class="fa fa-envelope"></i></div>
        <input pInputText class="form-control" type="email" name="email" placeholder="Email"
          autocomplete="username" ngModel required email #email="ngModel">
      </div>
      <span class="help-block" *ngIf="email.touched && email.errors?.['required']">{{'Champ obligatoire' | translate}}</span>
      <span class="help-block" *ngIf="email.touched && email.errors?.['email']">{{'Email invalide' | translate}}</span>
    </div>
    <div class="form-group" [class.has-error]="password.invalid && password.touched">
      <div class="input-group-icon right">
        <div class="input-icon"><i class="fa fa-lock font-16"></i></div>
        <input pInputText class="form-control" type="password" name="password" placeholder="Password"
          autocomplete="current-password" ngModel required #password="ngModel">
      </div>
      <span class="help-block" *ngIf="password.touched && password.errors?.['required']">{{'Champ obligatoire' | translate}}</span>
    </div>
    <div class="form-group">
      <button class="btn btn-info btn-block" type="submit" [disabled]="submitting">{{'Login' | translate}}</button>
    </div>
  </form>
</div>
</div>

<ngx-spinner></ngx-spinner>
